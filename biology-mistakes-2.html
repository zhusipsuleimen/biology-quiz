<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Қате жауаптар 2 — қайталау</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --text:#1c1e21; --muted:#6b7280;
  --border:#e3e5e9; --accent:#3b6fe0; --accent-dark:#2952b3;
  --green:#1f9d55; --green-bg:#e6f7ec; --red:#d0342c; --red-bg:#fdeceb;
  --amber:#c98a12; --amber-bg:#fdf3dc; --radius:14px;
  --shadow:0 2px 10px rgba(20,20,30,0.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171c; --card:#1e2128; --text:#eceef2; --muted:#9aa1ad;
    --border:#2c303a; --accent:#5b8bff; --accent-dark:#4671e0;
    --green:#3ecb72; --green-bg:#0f2b1a; --red:#ff6b63; --red-bg:#33191a;
    --amber:#e0ac3f; --amber-bg:#332a14;
    --shadow:0 2px 14px rgba(0,0,0,0.35);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; line-height:1.5;
}
.wrap{max-width:760px; margin:0 auto; padding:20px 16px 60px;}
h1{font-size:1.4rem; margin:8px 0 4px;}
.subtitle{color:var(--muted); font-size:0.92rem; margin-bottom:20px;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:20px;
}
.card + .card{margin-top:16px;}

/* ---- setup screen ---- */
.setup-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
.setup-header .count{font-weight:600; color:var(--accent);}
.toggle-all{display:flex; gap:8px;}
.toggle-all button{
  border:1px solid var(--border); background:transparent; color:var(--text);
  border-radius:8px; padding:6px 10px; font-size:0.82rem; cursor:pointer;
}
.toggle-all button:hover{border-color:var(--accent); color:var(--accent);}
.section-list{display:flex; flex-direction:column; gap:2px; max-height:420px; overflow-y:auto; margin:10px 0;}
.section-row{
  display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:9px; cursor:pointer;
}
.section-row:hover{background:var(--bg);}
.section-row input{width:17px; height:17px; accent-color:var(--accent); flex-shrink:0;}
.section-row .stitle{flex:1; font-size:0.92rem;}
.section-row .scount{color:var(--muted); font-size:0.82rem; flex-shrink:0;}
.option-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--border); margin-top:10px;}
.option-row label{font-size:0.92rem;}
.switch{position:relative; display:inline-block; width:42px; height:24px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; cursor:pointer; inset:0; background:var(--border); border-radius:24px; transition:0.15s;}
.slider:before{position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px; background:white; border-radius:50%; transition:0.15s;}
input:checked + .slider{background:var(--accent);}
input:checked + .slider:before{transform:translateX(18px);}
.start-btn{
  width:100%; margin-top:18px; padding:14px; border:none; border-radius:12px;
  background:var(--accent); color:white; font-size:1rem; font-weight:600; cursor:pointer;
}
.start-btn:disabled{opacity:0.45; cursor:not-allowed;}
.start-btn:not(:disabled):hover{background:var(--accent-dark);}

/* ---- quiz screen ---- */
.topbar{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.progress-outer{flex:1; height:8px; background:var(--border); border-radius:5px; overflow:hidden;}
.progress-inner{height:100%; background:var(--accent); border-radius:5px; transition:width 0.25s;}
.progress-text{font-size:0.82rem; color:var(--muted); white-space:nowrap;}
.score-badge{
  font-size:0.82rem; font-weight:600; padding:4px 10px; border-radius:20px;
  background:var(--green-bg); color:var(--green); white-space:nowrap;
}
.section-tag{
  display:inline-block; font-size:0.76rem; color:var(--accent); background:rgba(59,111,224,0.1);
  padding:3px 9px; border-radius:20px; margin-bottom:10px; font-weight:600;
}
.qtext{font-size:1.12rem; font-weight:600; margin:4px 0 16px; line-height:1.4;}
.hint{font-size:0.82rem; color:var(--muted); margin:-10px 0 14px;}
.options{display:flex; flex-direction:column; gap:9px;}
.opt{
  display:flex; align-items:center; gap:11px; padding:12px 14px; border:1.5px solid var(--border);
  border-radius:11px; cursor:pointer; font-size:0.96rem; transition:0.12s; background:var(--card);
}
.opt:hover:not(.locked){border-color:var(--accent); background:rgba(59,111,224,0.05);}
.opt .mark{
  width:22px; height:22px; border-radius:50%; border:2px solid var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:0.78rem; font-weight:700; color:white;
}
.opt.multi .mark{border-radius:6px;}
.opt.correct{border-color:var(--green); background:var(--green-bg);}
.opt.correct .mark{background:var(--green); border-color:var(--green);}
.opt.wrong{border-color:var(--red); background:var(--red-bg);}
.opt.wrong .mark{background:var(--red); border-color:var(--red);}
.opt.missed{border-color:var(--amber); background:var(--amber-bg);}
.opt.missed .mark{background:var(--amber); border-color:var(--amber);}
.opt.selected:not(.correct):not(.wrong){border-color:var(--accent); background:rgba(59,111,224,0.07);}
.opt.selected:not(.correct):not(.wrong) .mark{background:var(--accent); border-color:var(--accent);}
.opt.locked{cursor:default;}
.feedback{
  margin-top:14px; padding:11px 14px; border-radius:10px; font-size:0.9rem; font-weight:600;
  display:none;
}
.feedback.show{display:block;}
.feedback.ok{background:var(--green-bg); color:var(--green);}
.feedback.no{background:var(--red-bg); color:var(--red);}
.actions{display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px;}
.btn{
  padding:11px 20px; border-radius:10px; font-size:0.92rem; font-weight:600; cursor:pointer; border:none;
}
.btn-primary{background:var(--accent); color:white;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-primary:disabled{opacity:0.4; cursor:not-allowed;}
.btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text); border-color:var(--text);}

/* ---- results ---- */
.result-score{text-align:center; padding:10px 0 4px;}
.result-score .big{font-size:2.6rem; font-weight:800; color:var(--accent);}
.result-score .pct{font-size:1.1rem; color:var(--muted); margin-top:4px;}
.sec-breakdown{display:flex; flex-direction:column; gap:6px; margin-top:16px;}
.sec-breakdown .row{display:flex; align-items:center; gap:10px; font-size:0.86rem;}
.sec-breakdown .row .name{flex:1; color:var(--text);}
.sec-breakdown .bar{flex:1.4; height:7px; background:var(--border); border-radius:5px; overflow:hidden;}
.sec-breakdown .bar-inner{height:100%; background:var(--accent);}
.sec-breakdown .row .val{width:52px; text-align:right; color:var(--muted);}
.review-item{border-top:1px solid var(--border); padding:12px 0;}
.review-item .q{font-weight:600; font-size:0.92rem; margin-bottom:6px;}
.review-item .a{font-size:0.86rem; margin:2px 0;}
.review-item .a.your{color:var(--red);}
.review-item .a.correct{color:var(--green);}
.result-actions{display:flex; gap:10px; margin-top:18px;}
.result-actions .btn{flex:1;}
.hidden{display:none !important;}
.small-muted{font-size:0.8rem; color:var(--muted);}
</style>
</head>

    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="results" class="hidden">
    <div class="card result-score">

      <div id="reviewList"></div>
    </div>
    <div class="result-actions">
      <button class="btn btn-ghost" id="restartBtn">Қайта бастау</button>
    </div>
  </div>
</div>

<script>
const ALL_QUESTIONS = JSON.parse(document.getElementById('quiz-data').textContent);
const SECTIONS = JSON.parse(document.getElementById('sections-data').textContent);

// ---- Telegram Mini App integration ----
const tg = window.Telegram && window.Telegram.WebApp;

function applyTelegramTheme(){
  if(!tg) return;
  const tp = tg.themeParams || {};
  const root = document.documentElement.style;
  if(tp.bg_color) root.setProperty('--bg', tp.bg_color);
  if(tp.secondary_bg_color) root.setProperty('--card', tp.secondary_bg_color);
  if(tp.text_color) root.setProperty('--text', tp.text_color);
  if(tp.hint_color) root.setProperty('--muted', tp.hint_color);
  if(tp.button_color){
    root.setProperty('--accent', tp.button_color);
    root.setProperty('--accent-dark', tp.button_color);
  }
  document.body.style.backgroundColor = tp.bg_color || '';
}

function syncBackButton(){
  if(!tg || !tg.BackButton) return;
  tg.BackButton.show();
}

if(tg){
  tg.ready();
  tg.expand();
  applyTelegramTheme();
  tg.onEvent('themeChanged', applyTelegramTheme);
  try{ tg.setHeaderColor('bg_color'); }catch(e){}
  try{ tg.setBackgroundColor('bg_color'); }catch(e){}
  try{ tg.disableVerticalSwipes(); }catch(e){}
  if(tg.BackButton){
    tg.BackButton.show();
    tg.BackButton.onClick(() => {
      if(!resultsEl.classList.contains('hidden')){
        backToSetup();
      } else if(!quizEl.classList.contains('hidden')){
        if(score.total === 0) backToSetup(); else showResults();
      } else {
        window.location.href = 'index.html';
      }
    });
  }
}

let sessionQuestions = [];
let currentIndex = 0;
let score = {correct: 0, total: 0};
let secStats = {}; // {num: {correct,total}}
let reviewLog = []; // wrong-answer entries
let answered = false;
let selectedIdx = null;     // single mode
let selectedSet = new Set(); // multi mode

const setupEl = document.getElementById('setup');
const quizEl = document.getElementById('quiz');
const resultsEl = document.getElementById('results');
const sectionListEl = document.getElementById('sectionList');
const selCountEl = document.getElementById('selCount');

function buildSetup(){
  sectionListEl.innerHTML = '';
  SECTIONS.forEach(s => {
    const row = document.createElement('label');
    row.className = 'section-row';
    row.innerHTML = `
      <input type="checkbox" data-sec="${s.num}" checked>
      <span class="stitle">${s.num}-тарау. ${s.title}</span>
      <span class="scount">${s.count}</span>
    `;
    sectionListEl.appendChild(row);
  });
  sectionListEl.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', updateSelCount);
  });
  updateSelCount();
}

function getSelectedSections(){
  return new Set(
    Array.from(sectionListEl.querySelectorAll('input[type=checkbox]:checked'))
      .map(cb => parseInt(cb.dataset.sec, 10))
  );
}

function updateSelCount(){
  const sel = getSelectedSections();
  const count = ALL_QUESTIONS.filter(q => sel.has(q.section)).length;
  selCountEl.textContent = count;
  document.getElementById('startBtn').disabled = count === 0;
}

document.getElementById('selectAllBtn').addEventListener('click', () => {
  sectionListEl.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = true);
  updateSelCount();
});
document.getElementById('selectNoneBtn').addEventListener('click', () => {
  sectionListEl.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
  updateSelCount();
});

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

document.getElementById('startBtn').addEventListener('click', () => {
  const sel = getSelectedSections();
  let qs = ALL_QUESTIONS.filter(q => sel.has(q.section));
  if(document.getElementById('shuffleToggle').checked){
    qs = shuffleArr(qs);
  }
  sessionQuestions = qs;
  currentIndex = 0;
  score = {correct:0, total:0};
  secStats = {};
  reviewLog = [];
  setupEl.classList.add('hidden');
  resultsEl.classList.add('hidden');
  quizEl.classList.remove('hidden');
  renderQuestion();
  syncBackButton();
});

function sectionTitle(num){
  const s = SECTIONS.find(x => x.num === num);
  return s ? `${num}-тарау. ${s.title}` : '';
}

function renderQuestion(){
  answered = false;
  selectedIdx = null;
  selectedSet = new Set();
  const q = sessionQuestions[currentIndex];
  document.getElementById('sectionTag').textContent = sectionTitle(q.section);
  document.getElementById('qtext').textContent = q.question;
  document.getElementById('progressText').textContent = `${currentIndex+1} / ${sessionQuestions.length}`;
  document.getElementById('progressInner').style.width = `${(currentIndex/sessionQuestions.length)*100}%`;
  updateScoreBadge();

  const optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  const isMulti = q.type === 'multi';
  document.getElementById('multiHint').classList.toggle('hidden', !isMulti);
  document.getElementById('checkBtn').classList.toggle('hidden', false);
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('feedback').classList.remove('show');
  document.getElementById('checkBtn').disabled = isMulti; // enabled once a choice made

  q.options.forEach((optText, idx) => {
    const div = document.createElement('div');
    div.className = 'opt' + (isMulti ? ' multi' : '');
    div.dataset.idx = idx;
    const markChar = isMulti ? '' : '';
    div.innerHTML = `<span class="mark">${markChar}</span><span class="label">${optText}</span>`;
    div.addEventListener('click', () => onOptionClick(idx, isMulti));
    optsEl.appendChild(div);
  });

  if(!isMulti){
    document.getElementById('checkBtn').classList.add('hidden');
  }
}

function onOptionClick(idx, isMulti){
  if(answered) return;
  if(tg) tg.HapticFeedback.selectionChanged();
  if(isMulti){
    const div = document.querySelector(`#options .opt[data-idx="${idx}"]`);
    if(selectedSet.has(idx)){
      selectedSet.delete(idx);
      div.classList.remove('selected');
    } else {
      selectedSet.add(idx);
      div.classList.add('selected');
    }
    document.getElementById('checkBtn').disabled = selectedSet.size === 0;
  } else {
    selectedIdx = idx;
    checkAnswer();
  }
}

document.getElementById('checkBtn').addEventListener('click', () => {
  if(!answered) checkAnswer();
});

function checkAnswer(){
  const q = sessionQuestions[currentIndex];
  answered = true;
  const optDivs = Array.from(document.querySelectorAll('#options .opt'));
  optDivs.forEach(d => d.classList.add('locked'));

  let isCorrect;
  if(q.type === 'multi'){
    const correctSet = new Set(q.correct);
    isCorrect = correctSet.size === selectedSet.size && [...correctSet].every(i => selectedSet.has(i));
    optDivs.forEach((d, idx) => {
      const isCorrectOpt = correctSet.has(idx);
      const isSelected = selectedSet.has(idx);
      if(isCorrectOpt && isSelected) d.classList.add('correct');
      else if(!isCorrectOpt && isSelected) d.classList.add('wrong');
      else if(isCorrectOpt && !isSelected) d.classList.add('missed');
      d.querySelector('.mark').textContent = isSelected ? (isCorrectOpt ? '✓' : '✕') : (isCorrectOpt ? '✓' : '');
    });
  } else {
    isCorrect = selectedIdx === q.correct;
    optDivs.forEach((d, idx) => {
      if(idx === q.correct) d.classList.add('correct');
      else if(idx === selectedIdx) d.classList.add('wrong');
      d.querySelector('.mark').textContent = idx === q.correct ? '✓' : (idx === selectedIdx ? '✕' : '');
    });
  }

  if(tg) tg.HapticFeedback.notificationOccurred(isCorrect ? 'success' : 'error');
  score.total++;
  if(isCorrect) score.correct++;
  const sn = q.section;
  if(!secStats[sn]) secStats[sn] = {correct:0, total:0};
  secStats[sn].total++;
  if(isCorrect) secStats[sn].correct++;

  if(!isCorrect){
    const yourText = q.type === 'multi'
      ? Array.from(selectedSet).map(i => q.options[i]).join(', ')
      : (selectedIdx !== null ? q.options[selectedIdx] : '(жауап берілмеді)');
    const correctText = q.type === 'multi'
      ? q.correct.map(i => q.options[i]).join(', ')
      : q.options[q.correct];
    reviewLog.push({question: q.question, section: q.section, your: yourText, correct: correctText});
  }

  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  if(isCorrect){
    fb.className = 'feedback show ok';
    fb.textContent = '✓ Дұрыс!';
  } else {
    fb.className = 'feedback show no';
    const correctText = q.type === 'multi'
      ? q.correct.map(i => q.options[i]).join(', ')
      : q.options[q.correct];
    fb.textContent = `✕ Қате. Дұрыс жауап: ${correctText}`;
  }

  updateScoreBadge();
  document.getElementById('checkBtn').classList.add('hidden');
  document.getElementById('nextBtn').classList.remove('hidden');
}

function updateScoreBadge(){
  document.getElementById('scoreBadge').textContent = `${score.correct} / ${score.total}`;
}

document.getElementById('nextBtn').addEventListener('click', () => {
  if(currentIndex + 1 < sessionQuestions.length){
    currentIndex++;
    renderQuestion();
  } else {
    showResults();
  }
});

document.getElementById('stopBtn').addEventListener('click', () => {
  if(score.total === 0){
    backToSetup();
  } else {
    showResults();
  }
});

function backToSetup(){
  quizEl.classList.add('hidden');
  resultsEl.classList.add('hidden');
  setupEl.classList.remove('hidden');
  syncBackButton();
}

function showResults(){
  quizEl.classList.add('hidden');
  resultsEl.classList.remove('hidden');
  syncBackButton();
  if(tg) tg.HapticFeedback.notificationOccurred('success');
  document.getElementById('progressInner').style.width = '100%';

  document.getElementById('resultBig').textContent = `${score.correct} / ${score.total}`;
  const pct = score.total ? Math.round((score.correct/score.total)*100) : 0;
  document.getElementById('resultPct').textContent = `${pct}% дұрыс`;

  const brEl = document.getElementById('secBreakdown');
  brEl.innerHTML = '';
  Object.keys(secStats).map(Number).sort((a,b)=>a-b).forEach(num => {
    const st = secStats[num];
    const p = Math.round((st.correct/st.total)*100);
    const title = sectionTitle(num);
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="name">${title}</div>
      <div class="bar"><div class="bar-inner" style="width:${p}%"></div></div>
      <div class="val">${st.correct}/${st.total}</div>
    `;
    brEl.appendChild(row);
  });

  const reviewCard = document.getElementById('reviewCard');
  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  if(reviewLog.length === 0){
    reviewCard.classList.add('hidden');
  } else {
    reviewCard.classList.remove('hidden');
    reviewLog.forEach(r => {
      const div = document.createElement('div');
      div.className = 'review-item';
      div.innerHTML = `
        <div class="q">${r.question}</div>
        <div class="a your">Сіздің жауабыңыз: ${r.your}</div>
        <div class="a correct">Дұрыс жауап: ${r.correct}</div>
      `;
      reviewList.appendChild(div);
    });
  }
}

document.getElementById('restartBtn').addEventListener('click', () => {
  resultsEl.classList.add('hidden');
  backToSetup();
});

buildSetup();
</script>
</body>
</html>
