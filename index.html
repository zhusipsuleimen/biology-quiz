<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Биология — тесты для самоподготовки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --text:#1c1e21; --muted:#6b7280;
  --border:#e3e5e9; --accent:#3b6fe0; --accent-dark:#2952b3;
  --radius:14px; --shadow:0 2px 10px rgba(20,20,30,0.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171c; --card:#1e2128; --text:#eceef2; --muted:#9aa1ad;
    --border:#2c303a; --accent:#5b8bff; --accent-dark:#4671e0;
    --shadow:0 2px 14px rgba(0,0,0,0.35);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; line-height:1.5;
}
.wrap{max-width:760px; margin:0 auto; padding:20px 16px 60px;}
h1{font-size:1.4rem; margin:8px 0 4px;}
.subtitle{color:var(--muted); font-size:0.92rem; margin-bottom:20px;}
.subject{
  display:flex; align-items:center; gap:14px;
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px 20px; cursor:pointer; text-decoration:none; color:var(--text);
}
.subject + .subject{margin-top:14px;}
.subject:hover{border-color:var(--accent);}
.subject .emoji{font-size:1.9rem; flex-shrink:0;}
.subject .info{flex:1;}
.subject .name{font-size:1.02rem; font-weight:700; margin-bottom:2px;}
.subject .meta{font-size:0.84rem; color:var(--muted);}
.subject .arrow{font-size:1.2rem; color:var(--muted); flex-shrink:0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧬 Биология — тесты для самоподготовки</h1>
  <div class="subtitle">Выберите раздел</div>

  <a class="subject" href="razdel1.html">
    <div class="emoji">📘</div>
    <div class="info">
      <div class="name">Раздел 1. Биология как наука. Методы научного познания</div>
      <div class="meta">60 вопросов</div>
    </div>
    <div class="arrow">→</div>
  </a>

  <a class="subject" href="razdel2.html">
    <div class="emoji">🧫</div>
    <div class="info">
      <div class="name">Раздел 2. Клетка как биологическая система</div>
      <div class="meta">61 вопрос</div>
    </div>
    <div class="arrow">→</div>
  </a>
</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if(tg){
  tg.ready();
  tg.expand();
  const applyTheme = () => {
    const tp = tg.themeParams || {};
    const root = document.documentElement.style;
    if(tp.bg_color) root.setProperty('--bg', tp.bg_color);
    if(tp.secondary_bg_color) root.setProperty('--card', tp.secondary_bg_color);
    if(tp.text_color) root.setProperty('--text', tp.text_color);
    if(tp.hint_color) root.setProperty('--muted', tp.hint_color);
    if(tp.button_color){
      root.setProperty('--accent', tp.button_color);
      root.setProperty('--accent-dark', tp.button_color);
    }
    document.body.style.backgroundColor = tp.bg_color || '';
  };
  applyTheme();
  tg.onEvent('themeChanged', applyTheme);
  try{ tg.setHeaderColor('bg_color'); }catch(e){}
  try{ tg.setBackgroundColor('bg_color'); }catch(e){}
  if(tg.BackButton) tg.BackButton.hide();
  document.querySelectorAll('.subject').forEach(el => {
    el.addEventListener('click', () => tg.HapticFeedback.selectionChanged());
  });
}
</script>
</body>
</html>
